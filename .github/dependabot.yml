# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies (package.json at repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (ocr/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/ocr"
    schedule:
      interval: "weekly"
    # The OCR stack is intentionally pinned (see comments in ocr/requirements.txt):
    #   - paddleocr / paddlepaddle are held at 2.x; 3.x changes the predict API and
    #     must be validated on a real machine before adopting.
    #   - opencv 5.x requires numpy>=2, but numpy is pinned <2 here.
    # Ignore major bumps for these so Dependabot stops proposing breaking upgrades;
    # still allow minor/patch updates. Remove an entry when ready to migrate.
    ignore:
      - dependency-name: "paddleocr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "paddlepaddle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
